<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memória · Canivete</title>
<meta name="theme-color" content="#0F1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memória">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="porteiro.js" data-app="Memória" data-versao="0.1.0"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#0B1426; --cartao:#13213D; --cartao2:#182A4C; --texto:#F3EEDF; --mudo:#A8B3C7;
  --borda:#26385C; --ouro:#C9A227; --ouroTexto:#D9B64A; --marca:#2B2410; --perigo:#E58B7A;
}
[data-tema="claro"]{
  --fundo:#F5F1E6; --cartao:#FFFFFF; --cartao2:#F8F4EA; --texto:#0F1B33; --mudo:#4E5A70;
  --borda:#E2D9C2; --ouro:#C9A227; --ouroTexto:#7D600B; --marca:#F6E7A6; --perigo:#A33A26;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
.app{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 40px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.marca{display:flex;flex-direction:column}
.marca small{font-family:Cinzel,serif;font-size:12px;letter-spacing:3px;color:var(--ouroTexto)}
.marca h1{margin:0;font-family:'Cormorant Garamond',serif;font-size:36px;line-height:1.05}
.marca p{margin:2px 0 0;color:var(--mudo);font-size:14px}
.acoes{display:flex;align-items:center;gap:8px}
.icone{width:44px;height:44px;border-radius:999px;border:1px solid var(--borda);background:var(--cartao);color:var(--ouroTexto);display:flex;align-items:center;justify-content:center}
.versao{font-size:12px;color:var(--mudo);padding:0 4px}
form.busca{margin-top:22px;display:flex;gap:10px}
form.busca input{flex:1;min-width:0;height:54px;border-radius:14px;border:1px solid var(--borda);background:var(--cartao);color:var(--texto);padding:0 16px;font-size:18px}
form.busca input:focus{outline:2px solid var(--ouro);border-color:var(--ouro)}
.btn{height:54px;padding:0 20px;border-radius:14px;border:none;background:var(--ouro);color:#0F1B33;font-weight:600;font-size:16px}
.dicas{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dicas span{font-size:13px;color:var(--mudo)}
.chip{min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--borda);background:transparent;color:var(--texto);font-size:14px}
.chip.ativo{background:var(--ouro);border-color:var(--ouro);color:#0F1B33;font-weight:600}
.resumo{margin-top:26px;font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600}
.resumo small{display:block;font-family:Inter,sans-serif;font-size:14px;font-weight:400;color:var(--mudo);margin-top:2px}
.filtros{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.grupo{margin-top:24px}
.grupo h2{font-family:Cinzel,serif;font-size:13px;letter-spacing:2px;color:var(--ouroTexto);margin:0 0 10px;font-weight:600}
.grupo h2 span{color:var(--mudo);font-family:Inter,sans-serif;letter-spacing:0;font-weight:400}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.item{text-align:left;width:100%;border:1px solid var(--borda);background:var(--cartao);color:var(--texto);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.item:hover{border-color:var(--ouro)}
.item .titulo{font-size:16px;font-weight:600;line-height:1.3}
.item .ref{font-size:14px;color:var(--ouroTexto);font-weight:500}
.item .tema{font-size:13px;color:var(--mudo)}
.item .rodape{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.selo{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--cartao2);color:var(--texto)}
.selo.repetido{background:var(--marca);color:var(--texto);font-weight:600}
.vazio,.erro{margin-top:30px;padding:18px;border-radius:14px;border:1px dashed var(--borda);color:var(--mudo);font-size:15px;line-height:1.5}
.erro{border-style:solid;color:var(--perigo)}
.carregando{margin-top:30px;color:var(--mudo)}
/* leitura */
#leitor{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.55);display:none;align-items:stretch;justify-content:flex-end}
#leitor.aberto{display:flex}
#leitor .painel{width:min(720px,100%);height:100%;background:var(--fundo);border-left:1px solid var(--borda);display:flex;flex-direction:column}
#leitor .topo{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;border-bottom:1px solid var(--borda);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
#leitor .topo h3{margin:0;font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.1}
#leitor .meta{margin-top:6px;font-size:14px;color:var(--mudo);line-height:1.5}
#leitor .meta b{color:var(--ouroTexto);font-weight:500}
#leitor .corpo{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 22px calc(env(safe-area-inset-bottom,0px) + 30px);font-size:17px;line-height:1.65;white-space:pre-wrap}
mark{background:var(--marca);color:inherit;border-radius:3px;padding:0 2px}
.rodape-app{margin-top:40px;text-align:center;font-size:12px;color:var(--mudo)}
@media (max-width:560px){ .marca h1{font-size:30px} form.busca{flex-direction:column} form.busca input{flex:none;width:100%} .btn{width:100%} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="marca">
      <small>CANIVETE</small>
      <h1>Memória</h1>
      <p>Digite uma chave e veja o que você já fez com ela</p>
    </div>
    <div class="acoes">
      <span class="versao" id="versao"></span>
      <button class="icone" id="bTema" type="button" aria-label="Alternar modo claro e escuro"></button>
      <button class="icone" id="bAtualizar" type="button" aria-label="Atualizar app">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <form class="busca" id="fBusca" role="search">
    <label for="q" class="sr" style="position:absolute;left:-9999px">Chave</label>
    <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Romanos 8, Rm 8:28, batismo, santidade…">
    <button class="btn" type="submit">Buscar</button>
  </form>
  <div class="dicas" id="dicas"></div>

  <div id="saida"></div>

  <div class="rodape-app">Memória · Canivete do Bispo · <span id="versao2"></span></div>
</div>

<div id="leitor" aria-hidden="true">
  <div class="painel" role="dialog" aria-modal="true" aria-labelledby="lTitulo">
    <div class="topo">
      <div>
        <h3 id="lTitulo"></h3>
        <div class="meta" id="lMeta"></div>
      </div>
      <button class="icone" id="lFechar" type="button" aria-label="Fechar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="corpo" id="lCorpo"></div>
  </div>
</div>

<script>
/* =====================================================================
   MEMÓRIA — Canivete do Bispo
   · Busca no acervo do KTL por texto bíblico ("Romanos 8") ou palavra ("batismo").
   · Usa as funções memoria_buscar e memoria_documento do Supabase
     (arquivos memoria_etapa1.sql e memoria_etapa1b.sql).
   · Login: porteiro.js (o mesmo dos outros apps pessoais).
   ===================================================================== */
const VERSAO = '0.1.0';
const SUPA_URL = 'https://ghjbljypxksubmcsvaig.supabase.co';
const SUPA_KEY = 'sb_publishable_qXCYqg1WdmelY9D1mptZXg_U8NdoKby';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const lerLS = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const gravarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

const NOMES_TIPO = { sermao: 'Sermão', estudo: 'Estudo', aula: 'Aula', palestra: 'Palestra' };
const PLURAL_TIPO = { sermao: 'sermões', estudo: 'estudos', aula: 'aulas', palestra: 'palestras' };
const ROTULO_FILTRO = { sermao: 'Sermões', estudo: 'Estudos', aula: 'Aulas', palestra: 'Palestras' };

/* ---------- versão, tema e atualizar ---------- */
$('#versao').textContent = 'v' + VERSAO;
$('#versao2').textContent = 'v' + VERSAO;
const SOL = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const LUA = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function aplicarTema(t){
  document.documentElement.dataset.tema = t;
  $('#bTema').innerHTML = t === 'claro' ? LUA : SOL;
  document.querySelector('meta[name="theme-color"]').content = t === 'claro' ? '#F5F1E6' : '#0F1B33';
  gravarLS('canivete.tema', t);
}
aplicarTema(lerLS('canivete.tema', 'escuro'));
$('#bTema').onclick = () => aplicarTema(document.documentElement.dataset.tema === 'claro' ? 'escuro' : 'claro');
$('#bAtualizar').onclick = () => { if (window.porteiroAtualizar) window.porteiroAtualizar(); else location.reload(); };

/* ---------- conexão com o Supabase (mesmo login dos outros apps) ---------- */
let sb = null;
function cliente(){
  if (sb) return sb;
  if (!window.supabase) return null;
  sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { storageKey: 'bispo-auth', persistSession: true, autoRefreshToken: true } });
  return sb;
}
function esperarCliente(ms = 8000){
  return new Promise(ok => {
    const t0 = Date.now();
    (function tentar(){ const c = cliente(); if (c || Date.now() - t0 > ms) ok(c); else setTimeout(tentar, 120); })();
  });
}

/* ---------- buscas recentes e sugestões ---------- */
const SUGESTOES = ['Romanos 8', 'batismo', 'Salmo 23', 'santidade', 'Ceia do Senhor'];
function pintarDicas(){
  const rec = lerLS('memoria.recentes', []);
  const lista = rec.length ? rec : SUGESTOES;
  $('#dicas').innerHTML = `<span>${rec.length ? 'Recentes:' : 'Experimente:'}</span>` +
    lista.map(t => `<button class="chip" type="button" data-q="${esc(t)}">${esc(t)}</button>`).join('');
  $('#dicas').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { $('#q').value = b.dataset.q; buscar(b.dataset.q); });
}
function lembrar(q){
  const rec = lerLS('memoria.recentes', []).filter(t => semAcento(t) !== semAcento(q));
  rec.unshift(q); gravarLS('memoria.recentes', rec.slice(0, 8)); pintarDicas();
}
pintarDicas();

/* ---------- busca ---------- */
let ultimo = { q: '', linhas: [], filtro: 'todos' };

async function buscar(q){
  q = (q || '').trim();
  if (!q) return;
  const saida = $('#saida');
  saida.innerHTML = '<div class="carregando">Procurando na memória…</div>';
  const c = await esperarCliente();
  if (!c){ saida.innerHTML = '<div class="erro">Sem conexão com o banco. Confira a internet e tente de novo.</div>'; return; }
  const { data, error } = await c.rpc('memoria_buscar', { q, limite: 300 });
  if (error){
    const m = error.message || '';
    saida.innerHTML = /memoria_buscar|function/i.test(m)
      ? '<div class="erro">Falta rodar no Supabase o arquivo <b>memoria_etapa1b.sql</b>.</div>'
      : /jwt|auth|permission|denied/i.test(m)
        ? '<div class="erro">É preciso entrar com o seu login. Toque em atualizar ou abra o app de novo.</div>'
        : `<div class="erro">Não consegui buscar agora: ${esc(m)}</div>`;
    return;
  }
  lembrar(q);
  try { history.replaceState(null, '', '?q=' + encodeURIComponent(q)); } catch {}
  ultimo = { q, linhas: data || [], filtro: 'todos' };
  pintar();
}

function chaveTitulo(t){ return semAcento(t).replace(/[^a-z0-9]+/g, ' ').trim(); }
function ano(l){ const m = String(l.quando || '').match(/(\d{4})$/); return m ? +m[1] : null; }

function pintar(){
  const { q, linhas, filtro } = ultimo;
  const saida = $('#saida');
  if (!linhas.length){
    saida.innerHTML = `<div class="vazio">Nada encontrado para <b>${esc(q)}</b>.<br>Tente outra forma de escrever (por exemplo "Rm 8" ou só o livro e o capítulo), ou uma palavra mais simples.</div>`;
    return;
  }
  // repetidos: mesmo título mais de uma vez
  const contaTitulo = {};
  linhas.forEach(l => { const k = chaveTitulo(l.titulo); contaTitulo[k] = (contaTitulo[k] || 0) + 1; });

  // resumo
  const porTipo = {};
  linhas.forEach(l => { porTipo[l.tipo] = (porTipo[l.tipo] || 0) + 1; });
  const anos = linhas.map(ano).filter(Boolean);
  const periodo = anos.length ? (Math.min(...anos) === Math.max(...anos) ? `em ${anos[0]}` : `de ${Math.min(...anos)} a ${Math.max(...anos)}`) : '';
  const partes = Object.keys(porTipo).sort((a, b) => porTipo[b] - porTipo[a]).map(t => `${porTipo[t]} ${porTipo[t] === 1 ? (NOMES_TIPO[t] || t).toLowerCase() : (PLURAL_TIPO[t] || t)}`);
  const porTexto = linhas[0].motivo === 'texto';
  const repetidos = Object.values(contaTitulo).filter(n => n > 1).length;

  let html = `<div class="resumo">${linhas.length} ${linhas.length === 1 ? 'resultado' : 'resultados'} para “${esc(q)}”
    <small>${partes.join(', ')} ${periodo ? '· ' + periodo : ''}${repetidos ? ` · ${repetidos} ${repetidos === 1 ? 'título repetido' : 'títulos repetidos'}` : ''}${linhas.length >= 300 ? ' · mostrando os 300 primeiros' : ''}</small></div>`;

  // filtros por tipo
  const tipos = Object.keys(porTipo);
  if (tipos.length > 1){
    html += '<div class="filtros">' +
      [['todos', `Todos (${linhas.length})`], ...tipos.map(t => [t, `${porTipo[t] > 1 ? (ROTULO_FILTRO[t] || t) : (NOMES_TIPO[t] || t)} (${porTipo[t]})`])]
        .map(([v, r]) => `<button class="chip ${filtro === v ? 'ativo' : ''}" type="button" data-f="${esc(v)}">${esc(r)}</button>`).join('') +
      '</div>';
  }

  const visiveis = linhas.filter(l => filtro === 'todos' || l.tipo === filtro);
  let grupos;
  if (porTexto){
    grupos = [['Sobre este texto', visiveis]];
  } else {
    grupos = [
      ['Tratam do assunto', visiveis.filter(l => l.relevancia >= 0.4)],
      ['Mencionam de passagem', visiveis.filter(l => l.relevancia < 0.4)]
    ];
  }
  grupos.filter(g => g[1].length).forEach(([nome, ls]) => {
    html += `<section class="grupo"><h2>${esc(nome.toUpperCase())} <span>· ${ls.length}</span></h2><div class="lista">` +
      ls.map(l => {
        const n = contaTitulo[chaveTitulo(l.titulo)];
        return `<button class="item" type="button" data-id="${esc(l.documento)}">
          <span class="titulo">${esc(l.titulo || '(sem título)')}</span>
          ${l.referencia ? `<span class="ref">${esc(l.referencia)}</span>` : ''}
          ${l.tema ? `<span class="tema">${esc(l.tema)}</span>` : ''}
          <span class="rodape">
            <span class="selo">${esc(NOMES_TIPO[l.tipo] || l.tipo || '')}</span>
            ${l.quando ? `<span class="selo">${esc(l.quando)}</span>` : ''}
            ${l.lugar ? `<span class="selo">${esc(l.lugar)}</span>` : ''}
            ${n > 1 ? `<span class="selo repetido">repetido ${n}×</span>` : ''}
          </span></button>`;
      }).join('') + '</div></section>';
  });
  saida.innerHTML = html;
  saida.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { ultimo.filtro = b.dataset.f; pintar(); });
  saida.querySelectorAll('[data-id]').forEach(b => b.onclick = () => abrir(b.dataset.id));
}

/* ---------- leitura de um documento ---------- */
function textoLimpo(c){
  c = String(c || '');
  if (!/<[a-z][\s\S]*>/i.test(c)) return c;
  const html = c.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|h[1-6]|li|blockquote)>/gi, '\n\n').replace(/<li[^>]*>/gi, '• ');
  const doc = new DOMParser().parseFromString(html, 'text/html');
  return (doc.body.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
}
function destacar(textoEscapado, q){
  const termos = String(q || '').split(/\s+/).filter(t => t.length >= 3 && !/\d/.test(t)).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!termos.length) return textoEscapado;
  return textoEscapado.replace(new RegExp('(' + termos.join('|') + ')', 'gi'), '<mark>$1</mark>');
}
async function abrir(id){
  const L = $('#leitor');
  $('#lTitulo').textContent = 'Abrindo…'; $('#lMeta').textContent = ''; $('#lCorpo').textContent = '';
  L.classList.add('aberto'); L.setAttribute('aria-hidden', 'false');
  const c = cliente();
  const { data, error } = c ? await c.rpc('memoria_documento', { p_id: id }) : { data: null, error: { message: 'sem conexão' } };
  const d = data && data[0];
  if (error || !d){ $('#lTitulo').textContent = 'Não consegui abrir'; $('#lCorpo').textContent = error ? error.message : 'Documento não encontrado.'; return; }
  $('#lTitulo').textContent = d.titulo || '(sem título)';
  $('#lMeta').innerHTML = [
    d.referencia && `<b>${esc(d.referencia)}</b>`,
    d.tema && esc(d.tema),
    [NOMES_TIPO[d.tipo] || d.tipo, d.quando, d.lugar, d.serie && ('Série: ' + d.serie)].filter(Boolean).map(esc).join(' · ')
  ].filter(Boolean).join('<br>');
  const corpo = esc(textoLimpo(d.conteudo));
  $('#lCorpo').innerHTML = ultimo.linhas[0] && ultimo.linhas[0].motivo === 'palavra' ? destacar(corpo, ultimo.q) : corpo;
  $('#lCorpo').scrollTop = 0;
}
function fechar(){ const L = $('#leitor'); L.classList.remove('aberto'); L.setAttribute('aria-hidden', 'true'); }
$('#lFechar').onclick = fechar;
$('#leitor').addEventListener('click', e => { if (e.target.id === 'leitor') fechar(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#leitor').classList.contains('aberto')) fechar(); });

/* ---------- início ---------- */
$('#fBusca').addEventListener('submit', e => { e.preventDefault(); $('#q').blur(); buscar($('#q').value); });
const qInicial = new URLSearchParams(location.search).get('q');
if (qInicial){
  $('#q').value = qInicial;
  esperarCliente().then(async c => {
    if (!c) return;
    const s = await c.auth.getSession();
    if (s.data && s.data.session) buscar(qInicial);
    else window.addEventListener('porteiro:entrou', () => buscar(qInicial), { once: true });
  });
}

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
