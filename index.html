<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoje · Canivete</title>
<meta name="theme-color" content="#0F1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Canivete">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#0B1426; --cartao:#13213D; --cartao2:#182A4C; --texto:#F3EEDF; --mudo:#A8B3C7;
  --borda:#26385C; --ouro:#C9A227; --ouroTexto:#D9B64A; --marca:#2B2410; --perigo:#E58B7A; --ok:#5FC58A;
  --ok-bg:#1E4A33; --ok-fg:#8FE0B0; --meio-bg:#4A3E14; --meio-fg:#F0D27A; --novo-bg:#26385C; --novo-fg:#C8D1E0;
}
[data-tema="claro"]{
  --fundo:#F5F1E6; --cartao:#FFFFFF; --cartao2:#F8F4EA; --texto:#0F1B33; --mudo:#4E5A70;
  --borda:#E2D9C2; --ouro:#C9A227; --ouroTexto:#7D600B; --marca:#F6E7A6; --perigo:#A33A26; --ok:#1E7A46;
  --ok-bg:#DDF1E4; --ok-fg:#1E5E38; --meio-bg:#F6EBC8; --meio-fg:#6B520A; --novo-bg:#ECE6D6; --novo-fg:#4E5A70;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
a{color:var(--ouroTexto)}
.app{max-width:1240px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 96px)}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:14px}
.marca img{width:52px;height:52px;border-radius:12px}
.marca small{font-family:Cinzel,serif;font-size:12px;letter-spacing:3px;color:var(--ouroTexto)}
.marca h1{margin:0;font-family:'Cormorant Garamond',serif;font-size:32px;line-height:1.05}
.marca p{margin:2px 0 0;color:var(--mudo);font-size:14px}
.acoes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pilula{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--borda);background:var(--cartao);font-size:14px}
.pilula .mudo{color:var(--mudo);font-size:13px}
.sobe{color:var(--perigo)} .desce{color:var(--ok)}
.icone{width:44px;height:44px;border-radius:999px;border:1px solid var(--borda);background:var(--cartao);color:var(--ouroTexto);display:flex;align-items:center;justify-content:center}
.versao{font-size:12px;color:var(--mudo);padding:0 4px}
.alerta{margin-top:16px;padding:12px 16px;border-radius:14px;border:1px solid var(--perigo);color:var(--texto);background:var(--cartao);display:flex;gap:10px;align-items:center;font-size:14px}
.alerta b{color:var(--perigo)}
.grade{margin-top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.col2{grid-column:span 2}
.cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cartao.destaque{border-color:color-mix(in srgb,var(--ouro) 55%,var(--borda))}
.cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cab h2{margin:0;font-family:Cinzel,serif;font-size:13px;letter-spacing:2px;color:var(--ouroTexto);font-weight:600}
.cab .mudo{font-size:12px;color:var(--mudo)}
.cab a{font-size:13px;text-decoration:none}
.titulo-grande{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;line-height:1.1;margin:0}
.sub{font-size:14px;color:var(--mudo)}
.linha{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--cartao2)}
.linha .rot{font-size:13px;font-weight:600;color:var(--ouroTexto)}
.linha .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.linha .txt b{font-weight:500;font-size:15px}
.linha .txt span{font-size:13px;color:var(--mudo)}
.selo{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.s-pronto{background:var(--ok-bg);color:var(--ok-fg)} .s-rascunho{background:var(--meio-bg);color:var(--meio-fg)} .s-planejado{background:var(--novo-bg);color:var(--novo-fg)}
.botoes{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--borda);background:transparent;color:var(--texto);font-size:14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ouro{background:var(--ouro);border-color:var(--ouro);color:#0F1B33;font-weight:600}
.btn.peq{min-height:36px;padding:0 12px;font-size:13px}
.chave-livre{display:flex;gap:8px}
.chave-livre input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--borda);background:var(--cartao2);color:var(--texto);padding:0 14px;font-size:15px}
.chave-livre input:focus{outline:2px solid var(--ouro);border-color:var(--ouro)}
.agenda-item{display:flex;gap:12px;align-items:flex-start;padding:8px 10px;border-radius:10px}
.agenda-item.agora{background:var(--cartao2)}
.agenda-item .hora{width:46px;flex:none;font-size:13px;font-weight:600;color:var(--ouroTexto);padding-top:1px}
.agenda-item .o{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.35;min-width:0}
.agenda-item .o small{font-size:12px;color:var(--mudo)}
.agenda-item.feito .o{text-decoration:line-through;opacity:.55}
.grupo-rot{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--mudo);margin-top:4px}
.grupo-rot.atraso{color:var(--perigo)}
.mural{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mural h3{margin:0 0 8px;font-size:13px;color:var(--mudo);font-weight:600}
.postits{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.postit{border-radius:6px;padding:10px 12px;color:#2A2205;display:flex;flex-direction:column;gap:6px;min-height:78px;box-shadow:0 2px 6px rgba(0,0,0,.18);font-size:13px;line-height:1.35}
.postit b{font-weight:600;font-size:14px}
.postit small{font-size:11px;font-weight:600;color:#5C4A0C;margin-top:auto}
.postit.feito{opacity:.5;text-decoration:line-through}
.c-amarelo{background:#F3E39A}.c-azul{background:#BFD9F2}.c-rosa{background:#F4C6D3}.c-lilas{background:#D9CCF0}.c-verde{background:#C9E8C4}.c-laranja{background:#F6CFA4}
.sug{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.sug svg{flex:none;margin-top:2px}
.vazio{font-size:14px;color:var(--mudo);line-height:1.5}
.erro{font-size:13px;color:var(--perigo)}
.dev-tit{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;line-height:1.15;margin:0}
nav.comodos{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--cartao);border-top:1px solid var(--borda);padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;justify-content:center;gap:4px;overflow-x:auto}
nav.comodos button{min-height:48px;padding:0 14px;border-radius:12px;border:none;background:transparent;color:var(--texto);font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap}
nav.comodos button:hover{background:var(--cartao2)}
nav.comodos svg{color:var(--ouro)}
/* painéis laterais */
.painel-fundo{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.55);display:none;justify-content:flex-end}
.painel-fundo.aberto{display:flex}
.painel{width:min(680px,100%);height:100%;background:var(--fundo);border-left:1px solid var(--borda);display:flex;flex-direction:column}
.painel .topo{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;border-bottom:1px solid var(--borda);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.painel .topo h3{margin:0;font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.1}
.painel .meta{margin-top:6px;font-size:14px;color:var(--mudo)}
.painel .corpo{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 22px calc(env(safe-area-inset-bottom,0px) + 30px);font-size:17px;line-height:1.65}
.painel .corpo.texto{white-space:pre-wrap}
.lista-apps{display:flex;flex-direction:column;gap:18px}
.lista-apps h4{margin:0 0 8px;font-family:Cinzel,serif;font-size:13px;letter-spacing:2px;color:var(--ouroTexto)}
.lista-apps .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.lista-apps a{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;border:1px solid var(--borda);background:var(--cartao);text-decoration:none;color:var(--texto);font-size:15px;font-weight:500}
.lista-apps a small{color:var(--mudo);font-size:12px;font-weight:400}
.lista-apps a:hover{border-color:var(--ouro)}
@media (max-width:980px){ .grade{grid-template-columns:repeat(2,minmax(0,1fr))} .col2{grid-column:span 2} }
@media (max-width:680px){ .grade{grid-template-columns:1fr} .col2{grid-column:auto} .mural{grid-template-columns:1fr} .linha{grid-template-columns:1fr} .linha .botoes{justify-content:flex-start!important} .marca h1{font-size:28px} nav.comodos{justify-content:flex-start} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="marca">
      <img src="icon-192.png" alt="">
      <div>
        <small>CANIVETE</small>
        <h1 id="saudacao">Bom dia, Bispo</h1>
        <p id="dataLonga"></p>
      </div>
    </div>
    <div class="acoes">
      <div class="pilula" id="dolar" aria-live="polite"><span class="mudo">Dólar</span><span>…</span></div>
      <span class="versao" id="versao"></span>
      <button class="icone" id="bTema" type="button" aria-label="Alternar modo claro e escuro"></button>
      <button class="icone" id="bAtualizar" type="button" aria-label="Atualizar app">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <div id="alertaBackup"></div>

  <main class="grade">
    <section class="cartao destaque col2" id="cChave" aria-labelledby="hChave">
      <div class="cab"><h2 id="hChave">CHAVE DO DIA</h2><span class="mudo" id="rotina"></span></div>
      <div id="chaveCorpo"><div class="vazio">Carregando o calendário do KTL…</div></div>
      <form class="chave-livre" id="fChave" role="search">
        <label for="qChave" style="position:absolute;left:-9999px">Outra chave</label>
        <input id="qChave" type="search" enterkeyhint="search" autocomplete="off" placeholder="Outra chave: texto ou tema (ex.: Ceia do Senhor, Jo 15)">
        <button class="btn ouro" type="submit">Abrir na Memória</button>
      </form>
    </section>

    <section class="cartao" aria-labelledby="hAgenda" style="grid-row:span 2">
      <div class="cab"><h2 id="hAgenda">AGENDA</h2><a href="https://eneas-ena.github.io/UNI/" target="_blank" rel="noopener">Abrir UNI ›</a></div>
      <div id="agendaCorpo"><div class="vazio">Carregando…</div></div>
    </section>

    <section class="cartao col2" aria-labelledby="hMural">
      <div class="cab"><h2 id="hMural">MURAL</h2><a href="https://eneas-ena.github.io/vida_plena/" target="_blank" rel="noopener">Abrir Vida Plena ›</a></div>
      <div id="muralCorpo"><div class="vazio">Carregando…</div></div>
    </section>

    <section class="cartao" aria-labelledby="hDev">
      <div class="cab"><h2 id="hDev">DEVOCIONAL</h2><span class="mudo">Vida Plena</span></div>
      <div id="devCorpo"><div class="vazio">Carregando…</div></div>
    </section>

    <section class="cartao col2" aria-labelledby="hSug">
      <div class="cab"><h2 id="hSug">SUGESTÕES DA IA</h2><span class="mudo">conhecem a sua semana</span></div>
      <div id="sugCorpo"></div>
    </section>
  </main>
</div>

<nav class="comodos" aria-label="Cômodos">
  <button type="button" data-ir="memoria"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="4"/><path d="M11 11l9 9M16 16l2-2M18.5 18.5l2-2"/></svg>Memória</button>
  <button type="button" data-comodo="Palavra"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2zM4 5v16M8 7h6"/></svg>Palavra</button>
  <button type="button" data-comodo="Púlpito"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>Púlpito</button>
  <button type="button" data-comodo="Rebanho"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5"/></svg>Rebanho</button>
  <button type="button" data-comodo="Formação"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5"/></svg>Formação</button>
  <button type="button" data-comodo="Mesa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Mesa</button>
</nav>

<div class="painel-fundo" id="painel" aria-hidden="true">
  <div class="painel" role="dialog" aria-modal="true" aria-labelledby="pTitulo">
    <div class="topo">
      <div><h3 id="pTitulo"></h3><div class="meta" id="pMeta"></div></div>
      <button class="icone" id="pFechar" type="button" aria-label="Fechar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="corpo" id="pCorpo"></div>
  </div>
</div>

<script>
/* =====================================================================
   CANIVETE — Tela Hoje
   Junta numa tela só: a chave do dia (calendário do KTL), a agenda (UNI),
   o mural e o devocional (Vida Plena), o dólar e sugestões da IA.
   Só lê os outros apps: para editar, os botões abrem o app de origem.
   Precisa do canivete_hoje.sql rodado no Supabase.
   ===================================================================== */
const VERSAO = '0.4.1';
const SUPA_URL = 'https://ghjbljypxksubmcsvaig.supabase.co';
const SUPA_KEY = 'sb_publishable_qXCYqg1WdmelY9D1mptZXg_U8NdoKby';
const WORKER_IA = 'https://promptflow-ia.eneaspr.workers.dev';
const KTL_URL = 'https://ktl-bispo.eneaspr.workers.dev/';

const COMODOS = {
  'Palavra': [
    ['InterTextus', 'Bíblia interlinear', 'https://eneas-ena.github.io/interlinear/'],
    ['Anagnosis', 'Grego e hebraico', 'https://eneas-ena.github.io/anagnosis/'],
    ['Teólogo de Bolso PRO', 'Pesquisa bíblica', 'https://eneas-ena.github.io/teologia-de-bolso/'],
    ['Atlas das Profecias', 'Cartões de profecias', 'https://eneas-ena.github.io/atlas-profecias/'],
    ['Leitura da Bíblia', 'Trilhas de leitura', 'https://eneas-ena.github.io/leitura_biblia/']
  ],
  'Púlpito': [
    ['Ateliê do Sermão', 'DOCX da IA → diagramado para pregar', 'atelie.html'],
    ['KTL', 'Escrever sermões e calendário', KTL_URL],
    ['Pregador', 'No púlpito (iPad)', 'https://eneas-ena.github.io/pregador-visual/'],
    ['Scriba', 'Transcrever pregações', 'https://eneas-ena.github.io/scriba/'],
    ['NaCena', 'Teleprompter', 'https://eneas-ena.github.io/nacena/'],
    ['Gerador de slides', 'Slides dos sermões', 'https://eneas-ena.github.io/gerador-slides/']
  ],
  'Rebanho': [
    ['Receber', 'Visitantes e decisões', 'https://eneas-ena.github.io/receber/'],
    ['Estudos de Células', 'Estudos semanais', 'https://igreja-vidas.github.io/estudos-celulas/'],
    ['Devocional Bíblico', 'Devocional da igreja', 'https://eneas-ena.github.io/devocional-vidas/']
  ],
  'Formação': [
    ['MENTOR · Currículo', 'Apostilas das disciplinas', 'https://igreja-vidas.github.io/mentor-curriculo/'],
    ['Rede de Crianças', 'Material do infantil', 'https://eneas-ena.github.io/curriculo/'],
    ['Teologia em Minutos', 'Perguntas de teologia', 'https://eneas-ena.github.io/teologia-em-minutos/']
  ],
  'Mesa': [
    ['UNI', 'Agenda e tarefas', 'https://eneas-ena.github.io/UNI/'],
    ['Vida Plena', 'Mural, devocional e backup', 'https://eneas-ena.github.io/vida_plena/'],
    ['Pergaminho', 'Caderno digital', 'https://eneas-ena.github.io/pergaminho/'],
    ['PromptFlow', 'Construtor de prompts', 'https://eneas-ena.github.io/PromptFlow/']
  ]
};

/* Rotina da semana (para a linha do dia e para a IA) */
const ROTINA = {
  0: 'Domingo: três pregações',
  1: 'Segunda: curso MENTOR',
  2: 'Terça: faculdade à noite',
  3: 'Quarta: Estudos das Células · culto de oração à noite',
  4: 'Quinta: preparo dos sermões · faculdade à noite',
  5: 'Sexta: preparo dos sermões',
  6: 'Sábado: culto especial (às vezes prego)'
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const lerLS = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const gravarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];

/* ---------- datas (texto AAAA-MM-DD, no fuso do aparelho) ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => new Date(s + 'T00:00:00Z');
const addDias = (s, n) => { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diffDias = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const dow = s => parse(s).getUTCDay();
const HOJE = iso(new Date());
const AMANHA = addDias(HOJE, 1);
function dataLonga(s){ const d = parse(s); return `${DIAS[d.getUTCDay()]}, ${d.getUTCDate()} de ${MESES[d.getUTCMonth()]}`; }
function dataCurta(s){ const d = parse(s); return `${d.getUTCDate()} de ${MESES[d.getUTCMonth()]}`; }
const hhmm = t => t ? String(t).slice(0, 5) : '';

/* ---------- cabeçalho, tema, versão ---------- */
$('#versao').textContent = 'v' + VERSAO;
(function(){
  const h = new Date().getHours();
  $('#saudacao').textContent = (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + ', Bispo';
  const t = dataLonga(HOJE);

function cliente(){
  if (sb) return sb;

}
function esperarCliente(ms = 10000){
  return new Promise(ok => { const t0 = Date.now();
    (function tentar(){ const c = cliente(); if (c || Date.now() - t0 > ms) ok(c); else setTimeout(tentar, 120); })(); });
}

/* =====================================================================
   2. AGENDA — compromissos e tarefas do UNI
   ===================================================================== */
function ocorreUNI(e, d){
  if (e.date === d) return true;
  if (!e.recur || !e.date || d < e.date) return false;
  const diff = diffDias(e.date, d);
  switch (e.recur){
    case 'daily': return true;
    case 'weekly': return diff % 7 === 0;
    case 'biweekly': return diff % 14 === 0;
    case 'monthly': return e.date.slice(8) === d.slice(8);
    case 'yearly': return e.date.slice(5) === d.slice(5);
    default: return false;
  }
}
async function carregarAgenda(c){
  const [re, rt] = await Promise.all([c.from('events').select('*'), c.from('tasks').select('*')]);
  if (re.error && rt.error){ $('#agendaCorpo').innerHTML = `<div class="erro">Não consegui ler o UNI: ${esc(re.error.message)}</div>`; return; }
  const evs = (re.data || []).filter(e => ocorreUNI(e, HOJE)).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
  const tasks = rt.data || [];
  const tHoje = tasks.filter(t => (t.date || HOJE) === HOJE).sort((a, b) => (!!a.done - !!b.done) || (a.time || '99').localeCompare(b.time || '99'));
  const tAtraso = tasks.filter(t => t.date && t.date < HOJE && !t.done).sort((a, b) => a.date.localeCompare(b.date));
  contexto.agenda = evs.map(e => (e.time ? hhmm(e.time) + ' ' : '') + e.title)
    .concat(tHoje.filter(t => !t.done).map(t => 'Tarefa: ' + t.title))
    .concat(tAtraso.map(t => 'Tarefa atrasada: ' + t.title));

  const agora = new Date(), hAgora = pad(agora.getHours()) + ':' + pad(agora.getMinutes());
  let proxima = evs.findIndex(e => e.time && hhmm(e.time) >= hAgora);
  let html = '';
  html += '<div class="grupo-rot">COMPROMISSOS</div>';
  html += evs.length ? evs.map((e, i) => `<div class="agenda-item${i === proxima ? ' agora' : ''}">
      <span class="hora">${esc(hhmm(e.time) || '—')}</span>
      <span class="o"><span>${esc(e.title)}</span>${e.note ? `<small>${esc(e.note)}</small>` : ''}</span></div>`).join('')
    : '<div class="vazio">Nenhum compromisso hoje.</div>';
  html += '<div class="grupo-rot" style="margin-top:10px">TAREFAS</div>';
  if (tAtraso.length){
    html += `<div class="grupo-rot atraso">ATRASADAS · ${tAtraso.length}</div>` + tAtraso.slice(0, 5).map(t => `<div class="agenda-item">
      <span class="hora">${esc(dataCurta(t.date).replace(/ de .*$/, '/' + t.date.slice(5, 7)))}</span><span class="o"><span>${esc(t.title)}</span></span></div>`).join('');
    if (tAtraso.length > 5) html += `<div class="vazio">e mais ${tAtraso.length - 5} no UNI.</div>`;
  }
  html += tHoje.length ? tHoje.map(t => `<div class="agenda-item${t.done ? ' feito' : ''}">
      <span class="hora">${esc(hhmm(t.time) || '·')}</span><span class="o"><span>${esc(t.title)}</span></span></div>`).join('')
    : '<div class="vazio">Nenhuma tarefa para hoje.</div>';
  $('#agendaCorpo').innerHTML = html;
}

/* =====================================================================
   3. MURAL e DEVOCIONAL — do Vida Plena (mesmas regras de repetição dele)
   ===================================================================== */
function regraNaData(r, ini, d){
  const dd = diffDias(ini, d); if (dd < 0) return false;
  const dias = (r.dias_semana && r.dias_semana.length) ? r.dias_semana.map(Number) : null;
  switch (r.recorrencia){
    case 'diaria': return dias ? dias.includes(dow(d)) : true;
    case 'semanal': return (dias || [dow(ini)]).includes(dow(d));
    case 'quinzenal': if (!(dias || [dow(ini)]).includes(dow(d))) return false;
      return Math.floor(diffDias(addDias(ini, -dow(ini)), d) / 7) % 2 === 0;
    case 'mensal': return ini.slice(8) === d.slice(8);
    case 'anual': return ini.slice(5) === d.slice(5);
    case 'intervalo': { const n = Math.max(1, +r.intervalo || 1), u = r.intervalo_unidade || 'dias';
      if (u === 'dias') return dd % n === 0;
      if (u === 'semanas') return dd % (7 * n) === 0;
      if (u === 'meses'){ const a = parse(ini), x = parse(d); const m = (x.getUTCFullYear() - a.getUTCFullYear()) * 12 + x.getUTCMonth() - a.getUTCMonth(); return m % n === 0 && ini.slice(8) === d.slice(8); }
      return false; }
  }
  return false;
}
function ocorreNaData(t, d){
  if (t.tipo !== 'recorrente') return t.data === d;
  const ini = t.rec_inicio || t.data; if (!ini || d < ini) return false;
  if (t.rec_fim && d > t.rec_fim) return false;
  if (t.excecoes && t.excecoes.includes(d)) return false;
  return regraNaData(t, ini, d);
}
const OCULTAS = ['cancelada', 'dispensada'];
function itensDoDia(tarefas, ocorr, d){
  const om = {}; ocorr.forEach(o => { om[o.tarefa_id + '|' + o.data] = o; });
  const out = [];
  for (const t of tarefas){
    if (t.tipo !== 'recorrente'){
      if (t.data !== d || OCULTAS.includes(t.situacao)) continue;
      out.push({ t, feito: t.situacao === 'concluida' });
    } else if (ocorreNaData(t, d)){
      const o = om[t.id + '|' + d];
      if (o && o.nova_data && o.nova_data !== d) continue;
      if (o && OCULTAS.includes(o.situacao)) continue;
      out.push({ t, feito: !!(o && o.situacao === 'concluida') });
    }
  }
  for (const o of ocorr){
    if (o.nova_data === d && o.data !== d){
      const t = tarefas.find(x => x.id === o.tarefa_id);
      if (t && !OCULTAS.includes(o.situacao)) out.push({ t, feito: o.situacao === 'concluida' });
    }
  }
  const pr = { alta: 0, media: 1, baixa: 2 };
  return out.sort((a, b) => (!!b.t.fixada - !!a.t.fixada) || (a.t.hora_inicio || '99').localeCompare(b.t.hora_inicio || '99') || ((pr[a.t.prioridade] ?? 1) - (pr[b.t.prioridade] ?? 1)));
}
function eventoNaData(e, d){
  if (e.excecoes && e.excecoes.includes(d)) return false;
  if (!e.recorrencia) return e.data === d;
  if (d < e.data || (e.rec_fim && d > e.rec_fim)) return false;
  return regraNaData(e, e.data, d);
}
const COR_EVENTO = { culto: 'rosa', celula: 'verde', reuniao: 'amarelo', formacao: 'lilas', especial: 'laranja', visita: 'azul', pessoal: 'azul' };
function horario(x){ return x.hora_inicio ? hhmm(x.hora_inicio) + (x.hora_fim ? '–' + hhmm(x.hora_fim) : '') : 'Durante o dia'; }

async function carregarVidaPlena(c){
  const vp = c.schema('vidaplena');
  const [rt, ro, rev, rdv, rbk] = await Promise.all([
    vp.from('tarefas').select('*').limit(5000),
    vp.from('tarefa_ocorrencias').select('*').gte('data', addDias(HOJE, -120)).limit(5000),
    vp.from('eventos').select('*').limit(5000),
    vp.from('devocionais').select('data,titulo,referencia,texto_biblico,reflexao').eq('data', HOJE).maybeSingle(),
    vp.from('backup_execucoes').select('status,inicio,fim,tarefa_nome,mensagem').order('inicio', { ascending: false }).limit(5)
  ]);
  pintarMural(rt, ro, rev);
  pintarDevocional(rdv);
  pintarBackup(rbk);
}

function pintarMural(rt, ro, rev){
  if (rt.error){ $('#muralCorpo').innerHTML = `<div class="erro">Não consegui ler o Vida Plena: ${esc(rt.error.message)}</div>`; return; }
  const tarefas = rt.data || [], ocorr = ro.data || [], eventos = rev.data || [];
  const dia = d => {
    const its = itensDoDia(tarefas, ocorr, d).map(i => ({ titulo: i.t.titulo, cor: i.t.cor || 'amarelo', rodape: horario(i.t), feito: i.feito, alta: i.t.prioridade === 'alta', h: i.t.hora_inicio || '99' }));
    const evs = eventos.filter(e => e.no_mural !== false && eventoNaData(e, d)).map(e => ({ titulo: e.titulo, cor: COR_EVENTO[e.tipo] || 'azul', rodape: 'Agenda · ' + horario(e), feito: false, h: e.hora_inicio || '99' }));
    return evs.concat(its).sort((a, b) => (!!a.feito - !!b.feito) || String(a.h).localeCompare(String(b.h)));
  };
  const hoje = dia(HOJE), amanha = dia(AMANHA);
  contexto.mural = hoje.filter(x => !x.feito).map(x => x.titulo);
  const col = (rot, its) => `<div><h3>${rot} · ${its.length}</h3>${its.length
    ? `<div class="postits">${its.map(x => `<div class="postit c-${esc(x.cor)}${x.feito ? ' feito' : ''}"><b>${esc(x.titulo)}</b><small>${x.alta && !x.feito ? 'Alta · ' : ''}${esc(x.rodape)}</small></div>`).join('')}</div>`
    : '<div class="vazio">Nada no mural.</div>'}</div>`;
  $('#muralCorpo').innerHTML = `<div class="mural">${col('Hoje', hoje)}${col('Amanhã', amanha)}</div>`;
}

let devocional = null;

async function carregarDolar(){

    try {
      const r = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.1/dados/ultimos/2?formato=json');
      const j = await r.json();
      const v = j.map(x => +String(x.valor).replace(',', '.')).filter(x => x > 0);
      if (v.length){ d = { obtido: Date.now(), venda: v[v.length - 1], ant: v.length > 1 ? v[0] : null, data: j[j.length - 1].data }; gravarLS('canivete.dolar', d); }
    } catch {}
  }
  if (!d){ box.innerHTML = '<span class="mudo">Dólar</span><span>indisponível</span>'; return; }
  const varp = d.ant ? (d.venda - d.ant) / d.ant * 100 : null;
  box.innerHTML = `<span class="mudo">Dólar</span><b>R$ ${d.venda.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</b>` +
    (varp != null ? `<span class="${varp > 0.005 ? 'sobe' : varp < -0.005 ? 'desce' : 'mudo'}" style="font-size:12px;font-weight:600">${varp > 0 ? '+' : ''}${varp.toFixed(2).replace('.', ',')}%</span>` : '') +
    `<span class="mudo" title="PTAX venda do Banco Central">${esc(d.data || '')}</span>`;
}

    `Sermões do próximo domingo: ${sermoes.length ? sermoes.join(' | ') : 'nenhum planejado ainda'}.`,
    `Estudos de célula desta semana: ${contexto.estudos.length ? contexto.estudos.map(e => `${e.titulo} (${e.referencia || ''}, ${e.data})`).join('; ') : 'nenhum datado'}.`,
    `Agenda de hoje: ${contexto.agenda.length ? contexto.agenda.join('; ') : 'livre'}.`,
    `Mural de hoje: ${contexto.mural.length ? contexto.mural.join('; ') : 'vazio'}.`,
    `Devocional de hoje: ${contexto.dev || 'nenhum'}.`
  ].join('\n');
  const sistema = 'Você é o assistente pessoal de um bispo evangélico, pastor experiente e mestre em homilética. ' +
    'Com base no dia dele, dê exatamente 3 sugestões práticas e concretas para aproveitar o dia (priorização, preparo de sermão ou estudo, cuidado pastoral, descanso). ' +
    'Cada sugestão com no máximo 30 palavras, em português do Brasil, tratando-o por "o senhor". Não invente compromissos que não estão na lista. ' +
    'Responda SOMENTE com um array JSON de 3 strings, sem nenhum texto antes ou depois.';
  try {
    const r = await fetch(WORKER_IA, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-5-5', max_tokens: 600, system: sistema, messages: [{ role: 'user', content: sistema + '\n\n' + pedido }] }) });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(typeof j.error === 'string' ? j.error : (j.error && j.error.message) || ('HTTP ' + r.status));
    const txt = (j.content || []).map(p => p.text || '').join('');
    const a = txt.indexOf('['), z = txt.lastIndexOf(']');
    const lista = JSON.parse(txt.slice(a, z + 1)).map(String).slice(0, 3);
    gravarLS('canivete.sug.' + HOJE, lista);
  } catch (e){
    $('#sugCorpo').innerHTML = `<div class="erro">A IA não respondeu agora (${esc(e.message)}).</div><div class="botoes"><button class="btn peq" type="button" id="bSug">Tentar de novo</button></div>`;
    $('#bSug').onclick = pedirSugestoes;
    return;
  }
  pintarSugestoes();
}

/* =====================================================================
   PAINEL LATERAL (leitura do devocional e lista de apps dos cômodos)
   ===================================================================== */
function abrirPainel(titulo, meta, conteudo, comoTexto){
  $('#pTitulo').textContent = titulo; $('#pMeta').textContent = meta || '';
  const corpo = $('#pCorpo');
  corpo.className = 'corpo' + (comoTexto ? ' texto' : '');
  if (comoTexto) corpo.textContent = conteudo; else corpo.innerHTML = conteudo;
  corpo.scrollTop = 0;
  const P = $('#painel'); P.classList.add('aberto'); P.setAttribute('aria-hidden', 'false');
}
function fecharPainel(){ const P = $('#painel'); P.classList.remove('aberto'); P.setAttribute('aria-hidden', 'true'); }
$('#pFechar').onclick = fecharPainel;
$('#painel').addEventListener('click', e => { if (e.target.id === 'painel') fecharPainel(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharPainel(); });

document.querySelectorAll('nav.comodos [data-comodo]').forEach(b => b.onclick = () => {
  const nome = b.dataset.comodo;
  abrirPainel(nome, 'Os apps deste cômodo', `<div class="lista-apps"><div class="apps">` +
    COMODOS[nome].map(([n, d, u]) => `<a href="${esc(u)}"${/^https?:/.test(u) ? ' target="_blank" rel="noopener"' : ''}>${esc(n)}<small>${esc(d)}</small></a>`).join('') + '</div></div>', false);
});
document.querySelector('nav.comodos [data-ir="memoria"]').onclick = () => { location.href = 'memoria.html'; };

/* =====================================================================
   INÍCIO
   ===================================================================== */
carregarDolar();
pintarSugestoes();
esperarLogin().then(c => {
  if (!c){ $('#chaveCorpo').innerHTML = '<div class="erro">Sem conexão com o banco. Confira a internet e toque em atualizar.</div>'; return; }
  const seguro = (f, alvo) => f(c).catch(e => { if (alvo) $(alvo).innerHTML = `<div class="erro">${esc(e.message || e)}</div>`; });
  seguro(carregarChave, '#chaveCorpo');
  seguro(carregarAgenda, '#agendaCorpo');
  seguro(carregarVidaPlena, '#muralCorpo');
});

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
